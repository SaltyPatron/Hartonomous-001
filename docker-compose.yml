services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.pg
    container_name: hartonomous-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hartonomous}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hartonomous}
      POSTGRES_DB: ${POSTGRES_DB:-hartonomous}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ext/hartonomous_pg:/hartonomous_pg:ro
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    shm_size: 1g
    command: >
      postgres
        -c shared_buffers=512MB
        -c work_mem=64MB
        -c maintenance_work_mem=256MB
        -c max_wal_size=2GB
        -c effective_cache_size=2GB
        -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hartonomous} -d ${POSTGRES_DB:-hartonomous}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

services:
  postgres:
    # Image is built by scripts/docker/Build.ps1 (4-layer stack).
    # Run: pwsh scripts/docker/Build.ps1
    image: hartonomous-postgres:latest
    container_name: hartonomous-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hartonomous}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hartonomous}
      POSTGRES_DB: ${POSTGRES_DB:-hartonomous}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: bind
        source: ${HARTONOMOUS_CRASH_DUMP_DIR:-D:/WSL/crashes}
        target: /var/lib/postgresql/cores
    shm_size: 8g
    # Enable core dumps so SEGV / stack-smashing inside the hartonomous
    # extension produces a usable backtrace (task #86 — find the crashing
    # frame in the C extension code).
    ulimits:
      core: -1
    # NOTE: kernel.core_pattern is a global Linux sysctl (not per-container
    # namespaced) and recent runc versions reject it. To capture cores on the
    # host bind mount, set core_pattern on the WSL2 VM via /etc/wsl.conf or
    # `wsl -d docker-desktop -u root -- sh -c 'echo "/var/lib/postgresql/cores/core.%e.%p.%t" > /proc/sys/kernel/core_pattern'`
    # outside the container. Override HARTONOMOUS_CRASH_DUMP_DIR if D:/WSL/crashes
    # is not the desired host location. Default core_pattern drops cores into the
    # process's CWD, which is /var/lib/postgresql/data inside the container.
    # Tuned for: 14900KS (24 logical cores), 48GB DDR5 host, NVMe RAID0 (~14 GB/s).
    # Total Postgres memory budget: ~24GB (12GB shared + 8GB work distributed + 4GB maintenance),
    # leaving ~24GB for the OS, the C# decomposers running in parallel, and page cache.
    command: >
      postgres
        -c shared_buffers=12GB
        -c effective_cache_size=36GB
        -c work_mem=256MB
        -c maintenance_work_mem=4GB
        -c wal_buffers=64MB
        -c max_wal_size=16GB
        -c min_wal_size=4GB
        -c checkpoint_timeout=30min
        -c checkpoint_completion_target=0.9
        -c wal_compression=zstd
        -c synchronous_commit=off
        -c max_connections=100
        -c max_worker_processes=24
        -c max_parallel_workers=24
        -c max_parallel_workers_per_gather=8
        -c max_parallel_maintenance_workers=8
        -c random_page_cost=1.1
        -c effective_io_concurrency=256
        -c maintenance_io_concurrency=256
        -c default_statistics_target=200
        -c jit=off
        -c log_min_duration_statement=60000
        -c log_checkpoints=on
        -c log_lock_waits=on
        -c log_temp_files=10MB
        -c log_min_messages=DEBUG1
        -c log_error_verbosity=verbose
        -c log_destination=stderr
        -c logging_collector=off
        -c shared_preload_libraries=hartonomous
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hartonomous} -d ${POSTGRES_DB:-hartonomous}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

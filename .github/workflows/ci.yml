name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: ext/libhartonomous
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHARTONOMOUS_BUILD_TESTS=ON

      - name: Build
        working-directory: ext/libhartonomous
        run: cmake --build build --config Release

      - name: Test
        working-directory: ext/libhartonomous/build
        run: ctest -C Release --output-on-failure

  dotnet:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Configure native
        working-directory: ext/libhartonomous
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHARTONOMOUS_BUILD_TESTS=OFF

      - name: Build native (needed for P/Invoke tests)
        working-directory: ext/libhartonomous
        run: cmake --build build --config Release

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: hartonomous
          POSTGRES_PASSWORD: hartonomous
          POSTGRES_DB: hartonomous
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hartonomous -d hartonomous"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Enable PostGIS
        env:
          PGPASSWORD: hartonomous
        run: |
          psql -h localhost -p 5433 -U hartonomous -d hartonomous -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: migrate up
        env:
          HARTONOMOUS_DB: "Host=localhost;Port=5433;Username=hartonomous;Password=hartonomous;Database=hartonomous"
        run: dotnet run --project src/Hartonomous.Cli -c Release -- migrate up

      - name: migrate status
        env:
          HARTONOMOUS_DB: "Host=localhost;Port=5433;Username=hartonomous;Password=hartonomous;Database=hartonomous"
        run: dotnet run --project src/Hartonomous.Cli -c Release -- migrate status

      - name: migrate down + up (idempotency)
        env:
          HARTONOMOUS_DB: "Host=localhost;Port=5433;Username=hartonomous;Password=hartonomous;Database=hartonomous"
        run: |
          dotnet run --project src/Hartonomous.Cli -c Release -- migrate down 14
          dotnet run --project src/Hartonomous.Cli -c Release -- migrate up

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scaffolding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify AI scaffolding
        shell: pwsh
        run: pwsh -File scripts/verify/AgentScaffolding.ps1

      - name: Verify SQL schema shape
        shell: pwsh
        run: pwsh -File scripts/verify/SqlSchemaShape.ps1

      - name: Verify no inline SQL
        shell: pwsh
        run: pwsh -File scripts/verify/NoInlineSql.ps1

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: ext/libhartonomous
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHARTONOMOUS_BUILD_TESTS=ON

      - name: Build
        working-directory: ext/libhartonomous
        run: cmake --build build --config Release

      - name: Test
        working-directory: ext/libhartonomous/build
        run: ctest -C Release --output-on-failure

  dotnet:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Configure native
        working-directory: ext/libhartonomous
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHARTONOMOUS_BUILD_TESTS=OFF

      - name: Build native (needed for P/Invoke tests)
        working-directory: ext/libhartonomous
        run: cmake --build build --config Release

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble extension SQL
        shell: pwsh
        run: pwsh -File scripts/build/ExtensionSql.ps1

      - name: Verify generated extension SQL
        shell: pwsh
        run: pwsh -File scripts/build/ExtensionSql.ps1 -Check

    size_mb: 500
    grammar: tree-sitter-ucd-properties (TO AUTHOR; small custom over UCD .txt format)
    notes: "Already on disk. To re-fetch: rsync -av --delete ftp://ftp.unicode.org/Public/UCD/latest/ D:/Models/UCD/Public/UCD/latest/"


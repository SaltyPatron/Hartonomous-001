# Substrate seed dataset catalog.
#
# One entry per dataset. The download_seeds.py driver iterates this list
# and dispatches per `source` type. Each dataset has a target subdirectory
# under DATA_ROOT (default D:\Models). Manifest of completed downloads is
# tracked in DATA_ROOT/seed_manifest.json.
#
# Each entry's `grammar` field names the tree-sitter grammar (existing or
# to-author) that the substrate's decomposer will use to parse this dataset.
# See docs/20-technical/16-tree-sitter-grammar-strategy.md.
#
# Sources:
#   http_archive    Single archive URL (zip / tar.gz / tar.bz2 / .gz). Auto-extracted.
#   http_files      Multiple file URLs to drop into target/.
#   http_file       Single non-archive file URL.
#   git             Shallow git clone (depth=1) of a repo.
#   hf_dataset      Hugging Face dataset (snapshot_download via huggingface_hub).
#   hf_repo         Hugging Face model/space repo.
#   manual          Print instructions; do NOT auto-download (registration etc.).
#
# license_flags:
#   non_commercial  CC BY-NC*-style; substrate must filter from commercial output.
#   research_only   Free for research only; verify per use case.
#   share_alike     CC*-SA*; downstream redistribution must preserve license.
#   permissive      MIT/Apache/BSD/CC0/CC-BY; commercial-friendly.

